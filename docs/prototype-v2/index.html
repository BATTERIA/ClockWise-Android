<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClockWise — Minimal M3 Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <!-- Pixel 7 device frame -->
    <div class="device" role="img" aria-label="ClockWise app prototype on a Pixel 7 device frame">
      <div class="screen">
        <!-- Status bar -->
        <div class="status-bar" aria-hidden="true">
          <span class="status-time">9:41</span>
          <span class="status-icons">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22z"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7 3 2.7 5 0 8l12 14L24 8c-2.7-3-7-5-12-5z"/></svg>
            <svg width="22" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="0.6" y="0.6" width="22" height="10.8" rx="2.4"/>
              <rect x="2.6" y="2.6" width="18" height="6.8" rx="1" fill="currentColor"/>
              <rect x="23.4" y="4" width="1.8" height="4" rx="0.8" fill="currentColor" stroke="none"/>
            </svg>
          </span>
        </div>

        <!-- App content -->
        <div class="content">
          <h1 class="app-title" id="appTitle">ClockWise</h1>

          <!-- Analog clock (SVG) -->
          <div class="clock-wrap">
            <svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Analog clock">
              <!-- Face -->
              <circle cx="100" cy="100" r="94" class="face-bg" />
              <circle cx="100" cy="100" r="94" class="face-ring" />

              <!-- Hour ticks -->
              <g class="ticks" id="ticks"></g>

              <!-- Numbers 1-12 -->
              <g class="numbers" id="numbers"></g>

              <!-- Hands -->
              <line id="hourHand"   class="hand hand-hour"   x1="100" y1="100" x2="100" y2="58"  />
              <line id="minuteHand" class="hand hand-minute" x1="100" y1="100" x2="100" y2="40"  />
              <line id="secondHand" class="hand hand-second" x1="100" y1="100" x2="100" y2="32"  />

              <!-- Center pin -->
              <circle cx="100" cy="100" r="5"   class="pin-outer" />
              <circle cx="100" cy="100" r="2.5" class="pin-inner" />
            </svg>
          </div>

          <!-- Digital time -->
          <div class="digital">
            <div class="digital-time" id="digitalTime">10:23</div>
            <div class="digital-period" id="digitalPeriod">AM</div>
          </div>

          <!-- 12h / 24h toggle -->
          <div class="segmented" role="group" aria-label="Time format">
            <button class="segment" data-group="format" data-value="12" id="seg12">
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span class="label">12h</span>
            </button>
            <button class="segment" data-group="format" data-value="24" id="seg24">
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span class="label">24h</span>
            </button>
          </div>

          <!-- Language toggle -->
          <div class="segmented" role="group" aria-label="Language">
            <button class="segment" data-group="lang" data-value="zh" id="segZh">
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span class="label">中</span>
            </button>
            <button class="segment" data-group="lang" data-value="en" id="segEn">
              <span class="check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span class="label">EN</span>
            </button>
          </div>
        </div>

        <!-- Gesture pill -->
        <div class="gesture-pill" aria-hidden="true"></div>
      </div>
    </div>

    <p class="caption">Interactive M3 prototype — minimal clock</p>
    <footer class="footer">
      <a href="https://github.com/" target="_blank" rel="noopener">ClockWise · prototype-v2</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
