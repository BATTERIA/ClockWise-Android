<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Screen — ClockWise M3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/m3.css">
  <style>
    body {
      background:
        radial-gradient(at top left, #FFEDD5, transparent 40%),
        radial-gradient(at bottom right, #FCE7F3, transparent 40%),
        #FFF7ED;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .quiz-screen {
      background: linear-gradient(180deg, #FFFBFE 0%, #FFF7ED 100%);
    }

    /* Stars earned counter */
    .stars-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px 6px 10px;
      background: var(--md-sys-color-secondary-container);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--md-sys-color-on-secondary-container);
    }

    .stars-pill .material-symbols-rounded {
      font-size: 20px;
      color: var(--md-sys-color-star);
      font-variation-settings: 'FILL' 1, 'wght' 400;
    }

    /* Difficulty chip up top */
    .difficulty-strip {
      display: flex;
      justify-content: center;
      padding: 8px 16px;
    }

    /* Question text */
    .question-text {
      text-align: center;
      padding: 8px 24px 0;
      font-size: 24px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      line-height: 1.2;
    }

    .question-text-sub {
      text-align: center;
      padding: 4px 24px 16px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Quiz clock card */
    .quiz-clock-card {
      margin: 0 24px 20px;
      padding: 20px 12px;
      background: var(--md-sys-color-surface-container-lowest);
      border-radius: 24px;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.06),
        0 8px 20px rgba(249, 115, 22, 0.10);
    }

    .quiz-clock {
      width: 200px;
      height: 200px;
      display: block;
      margin: 0 auto;
    }

    /* 2x2 answer options */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 24px;
      margin-bottom: 16px;
    }

    .answer-btn {
      min-height: 64px;
      padding: 16px 12px;
      border-radius: 16px;
      background: var(--md-sys-color-surface);
      border: 2px solid var(--md-sys-color-outline-variant);
      font-family: inherit;
      font-size: 22px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .answer-btn .letter {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .answer-btn:hover {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-primary-container);
    }

    .answer-btn.selected {
      background: var(--md-sys-color-primary-container);
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary-container);
    }

    /* Bottom bar */
    .quiz-bottom-bar {
      padding: 12px 24px 16px;
      background: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 6px;
      background: var(--md-sys-color-outline-variant);
      transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    .progress-dot.complete {
      background: var(--md-sys-color-primary);
    }

    .progress-dot.correct {
      background: var(--md-sys-color-success);
    }

    .progress-dot.wrong {
      background: var(--md-sys-color-error);
    }

    .progress-dot.current {
      width: 24px;
      background: var(--md-sys-color-primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    .progress-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: linear-gradient(135deg, #FEF3C7, #FDE68A);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #B45309;
    }

    .submit-btn {
      width: 100%;
      height: 56px;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.30);
    }

    .submit-btn .material-symbols-rounded {
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="device-screen quiz-screen">

      <!-- Status Bar -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="icons">
          <svg viewBox="0 0 24 24"><path d="M2 22h4V10H2v12zm6 0h4V4H8v18zm6 0h4V14h-4v8zm6 0h4V8h-4v14z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M16.67 4H15V2h-6v2H7.33C6.6 4 6 4.6 6 5.33v15.33C6 21.4 6.6 22 7.33 22h9.33c.74 0 1.34-.6 1.34-1.33V5.33C18 4.6 17.4 4 16.67 4z"/></svg>
        </span>
      </div>

      <!-- Top App Bar -->
      <div class="m3-topbar center-aligned">
        <div class="leading">
          <button class="m3-icon-btn" aria-label="Close">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>
        <div class="title">Quiz</div>
        <div class="trailing">
          <div class="stars-pill" style="margin-right: 8px;">
            <span class="material-symbols-rounded">star</span>
            <span>23</span>
          </div>
        </div>
      </div>

      <!-- Difficulty chip -->
      <div class="difficulty-strip">
        <div class="m3-chip selected">
          <span class="material-symbols-rounded">trending_up</span>
          Medium · 中等
        </div>
      </div>

      <!-- Screen content -->
      <div class="screen-content">

        <!-- Question -->
        <div class="question-text">What time is this? 🤔</div>
        <div class="question-text-sub">现在是几点？</div>

        <!-- Quiz clock card -->
        <div class="quiz-clock-card">
          <svg class="quiz-clock" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="quizFace" cx="50%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#FFF7ED"/>
              </radialGradient>
              <linearGradient id="quizRing" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F97316"/>
                <stop offset="100%" stop-color="#EC4899"/>
              </linearGradient>
              <filter id="quizShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
              </filter>
            </defs>

            <!-- Outer ring -->
            <circle cx="100" cy="100" r="95" fill="none" stroke="url(#quizRing)" stroke-width="4"/>

            <!-- Face -->
            <circle cx="100" cy="100" r="89" fill="url(#quizFace)" filter="url(#quizShadow)"/>

            <!-- Cardinal hour markers -->
            <g stroke="#F97316" stroke-width="3" stroke-linecap="round">
              <line x1="100" y1="18"  x2="100" y2="30"/>
              <line x1="182" y1="100" x2="170" y2="100"/>
              <line x1="100" y1="182" x2="100" y2="170"/>
              <line x1="18"  y1="100" x2="30"  y2="100"/>
            </g>

            <!-- Diagonal markers -->
            <g stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round">
              <line x1="141.0" y1="28.0"  x2="135.4" y2="37.7"/>
              <line x1="172.0" y1="59.0"  x2="162.3" y2="64.6"/>
              <line x1="172.0" y1="141.0" x2="162.3" y2="135.4"/>
              <line x1="141.0" y1="172.0" x2="135.4" y2="162.3"/>
              <line x1="59.0"  y1="172.0" x2="64.6"  y2="162.3"/>
              <line x1="28.0"  y1="141.0" x2="37.7"  y2="135.4"/>
              <line x1="28.0"  y1="59.0"  x2="37.7"  y2="64.6"/>
              <line x1="59.0"  y1="28.0"  x2="64.6"  y2="37.7"/>
            </g>

            <!-- Numbers -->
            <g font-family="Roboto Flex, sans-serif" font-weight="700" font-size="22" fill="#431407" text-anchor="middle">
              <text x="100" y="50">12</text>
              <text x="152" y="108">3</text>
              <text x="100" y="166">6</text>
              <text x="48"  y="108">9</text>
            </g>
            <g font-family="Roboto Flex, sans-serif" font-weight="500" font-size="15" fill="#9A3412" text-anchor="middle">
              <text x="126" y="56">1</text>
              <text x="145" y="76">2</text>
              <text x="145" y="142">4</text>
              <text x="126" y="162">5</text>
              <text x="74"  y="162">7</text>
              <text x="55"  y="142">8</text>
              <text x="55"  y="76">10</text>
              <text x="74"  y="56">11</text>
            </g>

            <!-- Hour hand (2:30 → 2 + 30/60 = 2.5; angle = 2.5 * 30° = 75°) -->
            <g transform="rotate(75 100 100)">
              <rect x="96" y="50" width="8" height="56" rx="4" fill="#1E1B4B"/>
            </g>

            <!-- Minute hand (at 30 = 180°) -->
            <g transform="rotate(180 100 100)">
              <rect x="97.5" y="26" width="5" height="80" rx="2.5" fill="#F97316"/>
            </g>

            <!-- Center dot -->
            <circle cx="100" cy="100" r="7" fill="#1E1B4B"/>
            <circle cx="100" cy="100" r="3" fill="#FFFFFF"/>
          </svg>
        </div>

        <!-- 2x2 answer grid -->
        <div class="answer-grid">
          <button class="answer-btn">
            <span class="letter">A</span>
            2:00
          </button>
          <button class="answer-btn">
            <span class="letter">B</span>
            2:15
          </button>
          <button class="answer-btn selected">
            <span class="letter">C</span>
            2:30
          </button>
          <button class="answer-btn">
            <span class="letter">D</span>
            2:45
          </button>
        </div>

      </div>

      <!-- Bottom bar -->
      <div class="quiz-bottom-bar">
        <div class="progress-row">
          <span class="progress-label">Question 3 / 10</span>
          <div class="streak-pill">
            <span>🔥</span>
            <span>3</span>
          </div>
        </div>
        <div class="progress-dots">
          <div class="progress-dot correct"></div>
          <div class="progress-dot correct"></div>
          <div class="progress-dot current"></div>
          <div class="progress-dot"></div>
          <div class="progress-dot"></div>
          <div class="progress-dot"></div>
          <div class="progress-dot"></div>
          <div class="progress-dot"></div>
          <div class="progress-dot"></div>
          <div class="progress-dot"></div>
        </div>
        <button class="submit-btn">
          <span>Submit Answer</span>
          <span class="material-symbols-rounded">arrow_forward</span>
        </button>
      </div>

      <!-- Navigation pill -->
      <div class="nav-pill"></div>
    </div>
  </div>
</body>
</html>
